<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }} | {{ site.title | escape }}</title>
  <style>
    body { font: 1.05rem/1.6 system-ui, sans-serif; color: #17232c; margin: 0; }
    header { background: #123954; padding: 1rem; }
    header a { color: white; font-weight: 700; text-decoration: none; }
    main { max-width: 55rem; margin: auto; padding: 1rem; overflow-wrap: anywhere; }
    a { color: #005b9c; }
    img, video, iframe { max-width: 100%; }
    video { height: auto; }
    iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; }
    table { border-collapse: collapse; display: block; overflow-x: auto; }
    th, td { padding: .5rem; border: 1px solid #aebcc4; text-align: left; }
  </style>
</head>
<body>
  <header><a href="{{ '/' | relative_url }}">{{ site.title | escape }}</a></header>
  <main>{{ content }}</main>
</body>
</html>
